name: Build and Publish to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; don't cancel in-progress runs
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Install fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-open-sans
          wget -q -O /tmp/source-serif-4.zip \
            https://github.com/adobe-fonts/source-serif/releases/latest/download/source-serif-4-variable.zip
          wget -q -O /tmp/source-sans-3.zip \
            https://github.com/adobe-fonts/source-sans/releases/latest/download/source-sans-3-variable.zip
          wget -q -O /tmp/source-code-pro.zip \
            https://github.com/adobe-fonts/source-code-pro/releases/latest/download/OTF-source-code-pro.zip
          sudo mkdir -p /usr/local/share/fonts/adobe
          sudo unzip -qo /tmp/source-serif-4.zip  -d /usr/local/share/fonts/adobe
          sudo unzip -qo /tmp/source-sans-3.zip   -d /usr/local/share/fonts/adobe
          sudo unzip -qo /tmp/source-code-pro.zip -d /usr/local/share/fonts/adobe
          sudo fc-cache -f

      - name: Render HTML
        run: quarto render --to html

      - name: Render PDF
        run: quarto render --to pdf

      - name: Verify PDF exists
        run: test -f _book/laserheart-current.pdf

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
